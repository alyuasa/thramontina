<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar horário</title>
</head>

<body>
    <form method="GET" action="homec.html">
        
        
        
        <center>
            <h1>Agende seu horário</h1>
        </center>
        
        <fieldset>
            <legend>Data e hora</legend>
            <center>
                <label for="data">Dia do corte:</label>
            </center>
            
            <center>
                <input type="date" id="data" name="data" required>
            </center>
            <br>
            <center>
                <label for="hora">Horario do corte:</label>
            </center>
            
            <center>
                <input type="time" id="hora" name="hora" min="08:00" max="17:00" required>
            </center>
        </fieldset>
            
            <br>
            
            <center>
                <button type="submit">Entrar</button>
            </center>
    </form>


</body>

</html>

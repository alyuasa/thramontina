<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Horário</title>
</head>

<body>        
    <form method="GET" action="seleçãob.html">
        <center>
            <h1>Agende seu horário</h1>
      
      
        <fieldset>
         
                <strong>
                    <p>Selecione um de nossos horários dispoinveis:</p>
                </strong>
            

            <br>
                
                <label for="hora">Escolha o horario de atendimento (08:00 - 17:00)</label>
                
                <br>

                <input type="time" id="hora" name="hora" min="08:00" max="17:00" required>

            <br>
            <br>
            
                <label for="data">Selecione o dia do atendimento:</label>
                <br>
                <input type="date" id="data" name="data" required>
            
            <br>
            
        </fieldset>
        
        <br>
        <button type="submit">Confirmar</button>
    </center>
        
    </form>
</body

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Horário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
            line-height: 1.5;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 2.8rem;
            color: #d32f2f;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-shadow: 2px 2px 0 #000;
        }

        fieldset {
            border: 1px solid #444;
            border-radius: 6px;
            padding: 25px 20px;
            background: #161616;
        }

        legend {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            color: #ef5350;
            font-size: 1.35rem;
            padding: 0 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p strong {
            color: #ff5252;
            font-size: 1.15rem;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 1.1rem;
            color: #bbb;
            font-weight: 700;
        }

        input[type="time"],
        input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.15rem;
            background: #222;
            color: white;
            border: 2px solid #444;
            border-radius: 6px;
            font-family: 'Roboto Condensed', sans-serif;
            transition: all 0.2s;
        }

        input[type="time"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #d32f2f;
            box-shadow: 0 0 0 3px rgba(211,47,47,0.25);
        }

        button {
            display: block;
            width: 100%;
            margin: 35px auto 10px;
            padding: 16px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 5px 0 #b71c1c;
        }

        button:hover {
            background: #e53935;
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #b71c1c;
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #b71c1c;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.95rem;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Agende seu horário</h1>

        <form method="GET" action="seleçãob.html">
            <fieldset>
                <legend>Horário disponível</legend>

                <p><strong>Escolha data e hora que melhor se encaixa na sua agenda:</strong></p>

                <label for="data">Dia do atendimento</label>
                <input type="date" id="data" name="data" required>

                <label for="hora">Horário (08:00 – 17:00)</label>
                <input type="time" id="hora" name="hora" min="08:00" max="17:00" required step="900">
            </fieldset>

            <button type="submit">Confirmar Agendamento</button>

            <div class="subtitle">Horários sujeitos a disponibilidade</div>
        </form>
    </div>

</body>
</html>

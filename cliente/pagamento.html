<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Thramontina</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
            line-height: 1.5;
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 12px 45px rgba(0,0,0,0.85);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 2.9rem;
            color: #d32f2f;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2.8px;
            margin-bottom: 8px;
            text-shadow: 3px 3px 0 #000;
        }

        .subtitle {
            text-align: center;
            font-size: 1.35rem;
            color: #ff5252;
            margin-bottom: 35px;
            letter-spacing: 1.2px;
        }

        .summary {
            background: #161616;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 40px;
            font-size: 1.15rem;
        }

        .summary strong {
            color: #ff5252;
        }

        h3 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1.8rem;
            color: #e0e0e0;
            margin: 0 0 25px;
            text-align: center;
            letter-spacing: 1.5px;
        }

        .payment-options {
            display: grid;
            gap: 16px;
            margin-bottom: 40px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .payment-option:hover {
            border-color: #e53935;
            background: #222;
            transform: translateY(-2px);
        }

        .payment-option input[type="radio"] {
            display: none;
        }

        .payment-option input[type="radio"]:checked + label {
            border-color: #d32f2f;
            background: rgba(211, 47, 47, 0.12);
        }

        .payment-option label {
            flex: 1;
            display: flex;
            align-items: center;
            font-size: 1.35rem;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .payment-option .icon {
            font-size: 2.2rem;
            margin-right: 18px;
            color: #d32f2f;
            min-width: 50px;
            text-align: center;
        }

        .payment-option .details {
            flex: 1;
        }

        .payment-option .title {
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .payment-option .desc {
            font-size: 1rem;
            color: #bbbbbb;
            margin-top: 4px;
        }

        .coupon {
            margin-bottom: 35px;
        }

        .coupon input {
            width: 100%;
            padding: 15px 18px;
            font-size: 1.2rem;
            background: #222;
            color: white;
            border: 2px solid #444;
            border-radius: 8px;
        }

        .coupon input:focus {
            border-color: #d32f2f;
            outline: none;
            box-shadow: 0 0 0 4px rgba(211,47,47,0.2);
        }

        button {
            display: block;
            width: 100%;
            padding: 20px 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #b71c1c;
        }

        button:hover {
            background: #e53935;
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #b71c1c;
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #b71c1c;
        }

        .security {
            text-align: center;
            color: #777;
            font-size: 1rem;
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Pagamento</h1>
        <div class="subtitle">Escolha como quer pagar</div>

        <div class="summary">
            <p><strong>Valor:</strong> R$ 30,00</p>
        </div>

        <form method="GET" action="agradecimentos.html">
            <h3>Forma de Pagamento</h3>

            <div class="payment-options">
                <div class="payment-option">
                    <input type="radio" id="pix" name="forma_pagamento" value="pix" checked>
                    <label for="pix">
                        <span class="icon">⚡</span>
                        <div class="details">
                            <div class="title">Pix</div>
                            <div class="desc">Pagamento instantâneo – QR Code ou chave</div>
                        </div>
                    </label>
                </div>

                <div class="payment-option">
                    <input type="radio" id="cartao" name="forma_pagamento" value="cartao">
                    <label for="cartao">
                        <span class="icon">💳</span>
                        <div class="details">
                            <div class="title">Cartão de Crédito / Débito</div>
                            <div class="desc">Parcelamento em até 6x sem juros</div>
                        </div>
                    </label>
                </div>

                <div class="payment-option">
                    <input type="radio" id="boleto" name="forma_pagamento" value="boleto">
                    <label for="boleto">
                        <span class="icon">📄</span>
                        <div class="details">
                            <div class="title">Boleto Bancário</div>
                            <div class="desc">Vencimento em 3 dias úteis</div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="coupon">
                <input type="text" placeholder="Tem cupom de desconto? Digite aqui" id="cupom">
            </div>

            <button type="submit">Finalizar Pagamento</button>

            <div class="security">Pagamento 100% seguro • Seus dados estão criptografados</div>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thramontina - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 460px;
            width: 100%;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.85);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 3.2rem;
            color: #d32f2f;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 3px 3px 0 #000;
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1.8rem;
            color: #ff5252;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
        }

        fieldset {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px 25px;
            background: #161616;
        }

        label {
            display: block;
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 10px;
            font-weight: 700;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px 18px;
            font-size: 1.25rem;
            background: #222222;
            color: white;
            border: 2px solid #444;
            border-radius: 8px;
            font-family: 'Roboto Condensed', sans-serif;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #d32f2f;
            box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.2);
        }

        button {
            display: block;
            width: 100%;
            margin: 35px auto 15px;
            padding: 18px 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 6px 0 #b71c1c;
        }

        button:hover {
            background: #e53935;
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #b71c1c;
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #b71c1c;
        }

        .subtitle {
            margin-top: 30px;
            font-size: 1rem;
            color: #777777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Olá novamente</h1>
        <h2>Faça o seu login</h2>

        <form method="GET" action="homec2.html">
            <fieldset>
                <label for="email">Digite seu email</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@thramontina.com">

                <label for="senha">Digite sua senha</label>
                <input type="password" id="senha" name="senha" required placeholder="••••••••">
            </fieldset>

            <button type="submit">Entrar</button>

            <div class="subtitle">Bem-vindo de volta ao estilo Thramontina</div>
        </form>
    </div>

</body>
</html>

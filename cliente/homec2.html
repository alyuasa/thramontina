<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 3rem;
            color: #d32f2f;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.1;
        }

        .option {
            margin: 25px 0;
        }

        .option p {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1.6rem;
            color: #ff5252;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding: 16px 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            background: #d32f2f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 5px 0 #b71c1c;
        }

        button:hover {
            background: #e53935;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #b71c1c;
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #b71c1c;
        }

        .voltar-btn {
            background: #333;
            box-shadow: 0 5px 0 #222;
        }

        .voltar-btn:hover {
            background: #444;
            box-shadow: 0 9px 0 #222;
        }

        .subtitle {
            margin-top: 40px;
            font-size: 1rem;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Escolha o que você quer fazer</h1>

        <div class="option">
            <p>Agendar horário</p>
            <form method="GET" action="homec.html">
                <button type="submit">Agendar Agora</button>
            </form>
        </div>

        <div class="option">
            <p>Avalie nossos funcionários</p>
            <form method="GET" action="avaliação.html">
                <button type="submit">Avaliar</button>
            </form>
        </div>

        <div class="option">
            <form method="GET" action="login.html">
                <button type="submit" class="voltar-btn">Voltar</button>
            </form>
        </div>

        <div class="subtitle">Sua barbearia de confiança — sempre no estilo.</div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agradecimentos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 3.2rem;
            color: #d32f2f;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.1;
        }

        strong {
            font-size: 1.5rem;
            color: #ff5252;
            display: block;
            margin: 15px 0 30px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.3rem;
            color: #bbbbbb;
            margin: 20px 0 35px;
        }

        form {
            margin: 25px 0;
        }

        button {
            display: inline-block;
            width: 100%;
            max-width: 320px;
            padding: 16px 30px;
            margin: 12px auto;
            font-family: 'Oswald', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            background: #d32f2f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 5px 0 #b71c1c;
        }

        button:hover {
            background: #e53935;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #b71c1c;
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #b71c1c;
        }

        .subtitle {
            font-size: 1rem;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Obrigado por escolher a nossa barbearia!</h1>
        
        <strong>Aguarde até o seu atendimento</strong>
        
        <p>Volte sempre :)</p>

        <form method="GET" action="avaliação.html">
            <p>Avaliar nossos funcionários</p>
            <button type="submit">Avaliar</button>
        </form>

        <form method="GET" action="homec2.html">
            <button type="submit">Voltar para o início</button>
        </form>

        <div class="subtitle">Sua próxima visita já está marcada no estilo certo.</div>
    </div>

</body>
</html>

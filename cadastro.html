<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thramontina - Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 3rem;
            color: #d32f2f;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.1;
        }

        fieldset {
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 24px 20px;
            text-align: left;
        }

        legend {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #ff5252;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0 10px;
        }

        label {
            display: block;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            margin-top: 18px;
        }

        label:first-of-type {
            margin-top: 16px;
        }

        input[type="text"],
        input[type="password"] {
            display: block;
            width: 100%;
            padding: 12px 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #444;
        }

        button[type="submit"] {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 30px auto 0;
            padding: 16px 30px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            background: #d32f2f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 5px 0 #b71c1c;
        }

        button[type="submit"]:hover {
            background: #e53935;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #b71c1c;
        }

        button[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 #b71c1c;
        }

        .subtitle {
            margin-top: 28px;
            font-size: 0.9rem;
            color: #555;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo à Thramontina!</h1>
        <form method="GET" action="./homec2.html">
            <fieldset>
                <legend>Faça seu cadastro abaixo</legend>

                <label for="nome">Digite seu nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

                <label for="email">Digite seu email:</label>
                <input type="text" id="email" name="email" placeholder="seu@email.com" required>

                <label for="senha">Digite sua senha:</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>

        <p class="subtitle">Thramontina &mdash; <i>Corte rápido!</i></p>
    </div>
</body>
</html>
